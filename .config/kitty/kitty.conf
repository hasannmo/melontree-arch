# Kitty Terminal Configuration

# Font
font_family JetBrains Mono Nerd Font
font_size 12
disable_ligatures never

# Colors (Ashen Reverie palette)
background #1B1A18
foreground #F4EEE5
selection_background #E98570
selection_foreground #1B1A18

# Black -> Charcoal
color0 #1B1A18
color8 #A89C91

# Red -> Vermilion (primary accent)
color1 #9E433B
color9 #C85B4D

# Green -> Sage
color2  #596B57
color10 #7F9478

# Yellow -> Ochre
color3  #9B7A3E
color11 #C2A15B

# Blue -> Steel Blue
color4  #3F6265
color12 #62878A

# Magenta -> Dust Violet
color5  #756278
color13 #9B86A0

# Cyan -> Terracotta
color6  #A65F42
color14 #C9825F

# White -> Ivory
color7  #C8BFB5
color15 #F4EEE5

# Cursor
cursor #E98570
cursor_shape block
cursor_beam_thickness 1.5

# Window
window_padding_width 12
window_margin_width 0
draw_minimal_borders yes
single_window_margin_width -1

# Scrollback
scrollback_lines 10000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# Mouse
mouse_hide_wait 3
copy_on_select yes

# Bell
enable_audio_bell no
visual_bell_duration 0.0

# Wayland
linux_display_server auto

# Tab bar
tab_bar_edge bottom
tab_bar_style powerline
active_tab_foreground #1B1A18
active_tab_background #9E433B
inactive_tab_foreground #C8BFB5
inactive_tab_background #3B3731