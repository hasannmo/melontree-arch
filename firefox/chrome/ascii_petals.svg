<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1920 1080">
  <defs>
    <style>
      /* ANIM_OFF */
      .petal { display: none; }

      .petal {
        font-family: 'JetBrainsMono Nerd Font', 'JetBrains Mono', monospace;
        font-weight: 300;
        user-select: none;
      }
      
      @keyframes drift1 {
        0%   { transform: translateY(-30px) translateX(0px) rotate(0deg); opacity: 0; }
        15%  { opacity: 0.65; }
        85%  { opacity: 0.65; }
        100% { transform: translateY(1120px) translateX(120px) rotate(180deg); opacity: 0; }
      }
      @keyframes drift2 {
        0%   { transform: translateY(-30px) translateX(0px) rotate(0deg); opacity: 0; }
        15%  { opacity: 0.55; }
        85%  { opacity: 0.55; }
        100% { transform: translateY(1120px) translateX(-100px) rotate(-160deg); opacity: 0; }
      }
      @keyframes drift3 {
        0%   { transform: translateY(-30px) translateX(0px) rotate(0deg); opacity: 0; }
        15%  { opacity: 0.70; }
        85%  { opacity: 0.70; }
        100% { transform: translateY(1120px) translateX(80px) rotate(220deg); opacity: 0; }
      }

      .flow1 { animation: drift1 14s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
      .flow2 { animation: drift2 18s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
      .flow3 { animation: drift3 22s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
  </defs>

  <!-- Solid Charcoal 100 Background -->
  <rect width="100%" height="100%" fill="#1B1A18" />

  <!-- Animated Floating ASCII Glyphs (Ivory, Steel Blue, Rose, Sage) -->
  <g class="petal flow1" style="animation-delay: 0s;">
    <text x="120" y="0" font-size="20" fill="#E0D8D0">✻</text>
  </g>
  <g class="petal flow2" style="animation-delay: -3s;">
    <text x="320" y="0" font-size="24" fill="#C18B91">✿</text>
  </g>
  <g class="petal flow3" style="animation-delay: -7s;">
    <text x="540" y="0" font-size="16" fill="#62878A">✦</text>
  </g>
  <g class="petal flow1" style="animation-delay: -10s;">
    <text x="750" y="0" font-size="18" fill="#F4EEE5">°</text>
  </g>
  <g class="petal flow2" style="animation-delay: -5s;">
    <text x="960" y="0" font-size="22" fill="#E0D8D0">❀</text>
  </g>
  <g class="petal flow3" style="animation-delay: -12s;">
    <text x="1150" y="0" font-size="15" fill="#7F9478">✧</text>
  </g>
  <g class="petal flow1" style="animation-delay: -4s;">
    <text x="1350" y="0" font-size="22" fill="#C18B91">※</text>
  </g>
  <g class="petal flow2" style="animation-delay: -9s;">
    <text x="1560" y="0" font-size="18" fill="#91B5B5">✻</text>
  </g>
  <g class="petal flow3" style="animation-delay: -2s;">
    <text x="1780" y="0" font-size="20" fill="#E0D8D0">✿</text>
  </g>

  <!-- Staggered Second Layer -->
  <g class="petal flow2" style="animation-delay: -14s;">
    <text x="220" y="0" font-size="17" fill="#7F9478">·</text>
  </g>
  <g class="petal flow1" style="animation-delay: -8s;">
    <text x="440" y="0" font-size="22" fill="#F4EEE5">❀</text>
  </g>
  <g class="petal flow3" style="animation-delay: -16s;">
    <text x="680" y="0" font-size="19" fill="#C18B91">※</text>
  </g>
  <g class="petal flow2" style="animation-delay: -1s;">
    <text x="880" y="0" font-size="24" fill="#62878A">✦</text>
  </g>
  <g class="petal flow1" style="animation-delay: -11s;">
    <text x="1080" y="0" font-size="16" fill="#E0D8D0">✻</text>
  </g>
  <g class="petal flow3" style="animation-delay: -6s;">
    <text x="1280" y="0" font-size="22" fill="#C8BFB5">✿</text>
  </g>
  <g class="petal flow2" style="animation-delay: -15s;">
    <text x="1480" y="0" font-size="18" fill="#F4EEE5">✧</text>
  </g>
  <g class="petal flow1" style="animation-delay: -13s;">
    <text x="1680" y="0" font-size="20" fill="#91B5B5">°</text>
  </g>
</svg>
